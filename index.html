<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>JDot Games</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    body { background-color: #0f1115; touch-action: pan-x pan-y; }
    .scrollbar-hide::-webkit-scrollbar { display: none; }
    .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="text-white font-sans overflow-hidden selection:bg-blue-500 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const firebaseConfig = {
      apiKey: "AIzaSyAZGd0RkWuKwHXMu0CeBA-929PKygz3CNY",
      authDomain: "jdotgames-604ae.firebaseapp.com",
      projectId: "jdotgames-604ae",
      storageBucket: "jdotgames-604ae.firebasestorage.app",
      messagingSenderId: "1018069170554",
      appId: "1:1018069170554:web:15dc5ff8e807cf0c8f7ec3",
      measurementId: "G-QCL0B1G6Z2"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const auth = firebase.auth();
    const db = firebase.firestore();

    function App() {
      const [gamesData, setGamesData] = React.useState([]);
      const [user, setUser] = React.useState(null);
      const [activeTab, setActiveTab] = React.useState('featured');
      const [loading, setLoading] = React.useState(true);
      const [focusedIndex, setFocusedIndex] = React.useState(0);
      const [shelf, setShelf] = React.useState([]);

      React.useEffect(() => {
        const unsubscribe = auth.onAuthStateChanged(currentUser => {
          setUser(currentUser);
          if (currentUser) {
            db.collection('users').doc(currentUser.uid).get().then(doc => {
              if (doc.exists && doc.data().shelf) {
                setShelf(doc.data().shelf);
              }
            }).catch(() => {
              setShelf([]);
            });
          } else {
            setShelf([]);
          }
        });
        return () => unsubscribe();
      }, []);

      React.useEffect(() => {
        async function loadB2Games() {
          try {
            const response = await fetch('/api/get-games');
            if (!response.ok) throw new Error('API routing failed');
            
            const data = await response.json();
            const gamesArray = Array.isArray(data.games) ? data.games : (Array.isArray(data) ? data : []);
            setGamesData(gamesArray);
          } catch (error) {
            setGamesData([]);
          } finally {
            setLoading(false);
          }
        }
        loadB2Games();
      }, []);

      const safeGamesData = Array.isArray(gamesData) ? gamesData : [];
      const displayGames = activeTab === 'featured' 
        ? safeGamesData.filter(g => g.featured) 
        : activeTab === 'shelf' ? shelf : safeGamesData;

      React.useEffect(() => {
        const handleKeyDown = (e) => {
          if (!displayGames || displayGames.length === 0) return;
          
          let cols = 8;
          if (window.innerWidth >= 1280) cols = 12; // xl
          else if (window.innerWidth >= 768) cols = 10; // md
          
          if (e.key === 'ArrowRight') {
            e.preventDefault();
            setFocusedIndex(prev => Math.min(prev + 1, displayGames.length - 1));
          } else if (e.key === 'ArrowLeft') {
            e.preventDefault();
            setFocusedIndex(prev => Math.max(prev - 1, 0));
          } else if (e.key === 'ArrowDown') {
            e.preventDefault();
            setFocusedIndex(prev => Math.min(prev + cols, displayGames.length - 1));
          } else if (e.key === 'ArrowUp') {
            e.preventDefault();
            setFocusedIndex(prev => Math.max(prev - cols, 0));
          } else if (e.key === 'Enter') {
            e.preventDefault();
            const game = displayGames[focusedIndex];
            if (game && game.url) window.location.href = game.url;
          }
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [displayGames, focusedIndex]);

      React.useEffect(() => {
        const activeCard = document.getElementById(`game-card-${focusedIndex}`);
        if (activeCard) {
          activeCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
      }, [focusedIndex]);

      const handleGameClick = (index, gameUrl) => {
        if (focusedIndex === index) {
          window.location.href = gameUrl;
        } else {
          setFocusedIndex(index);
        }
      };

      const toggleShelf = (game) => {
        if (!user) return;
        const newShelf = shelf.some(g => g.id === game.id) 
          ? shelf.filter(g => g.id !== game.id)
          : [...shelf, game];
        
        setShelf(newShelf);
        db.collection('users').doc(user.uid).set({ shelf: newShelf }, { merge: true });
      };

      const login = () => {
        const provider = new firebase.auth.GoogleAuthProvider();
        auth.signInWithPopup(provider);
      };
      
      const logout = () => auth.signOut();

      if (loading) {
        return (
          <div className="flex items-center justify-center h-[100dvh] bg-[#0f1115]">
            <div className="animate-spin rounded-full h-16 w-16 border-t-4 border-blue-500"></div>
          </div>
        );
      }

      const focusedGame = displayGames[focusedIndex];

      return (
        <div className="flex flex-col h-[100dvh] bg-[#0f1115]">
          
          {/* Portrait Mobile Top Header */}
          <header className="landscape:hidden md:hidden flex justify-between items-center p-4 bg-gray-900 border-b border-gray-800 flex-shrink-0 z-20 shadow-md">
            <div className="flex items-center gap-2">
              <span className="text-2xl drop-shadow-[0_0_8px_rgba(59,130,246,0.8)]">🎮</span>
              <h1 className="text-sm mt-1 text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-purple-500" style={{ fontFamily: "'Press Start 2P', cursive" }}>JDOT</h1>
            </div>
            {user ? (
              <img onClick={logout} src={user.photoURL} alt="Profile" className="w-8 h-8 rounded-full border-2 border-indigo-500 shadow-sm cursor-pointer" />
            ) : (
              <button onClick={login} className="px-3 py-1.5 bg-blue-600 hover:bg-blue-500 text-xs font-bold rounded-full transition-colors">Sign In</button>
            )}
          </header>

          {/* Main Workspace */}
          <div className="flex-1 flex flex-row overflow-hidden">
            
            {/* Sidebar (Visible on Desktop & Landscape Mobile) */}
            <aside className="hidden landscape:flex md:flex w-20 lg:w-64 bg-gray-900 border-r border-gray-800 flex-col justify-between flex-shrink-0 z-20 shadow-2xl">
              <div className="flex flex-col h-full overflow-hidden">
                <div className="p-4 lg:p-6 flex flex-col lg:flex-row items-center justify-center lg:justify-start gap-2 lg:gap-3 flex-shrink-0">
                  <span className="text-2xl lg:text-3xl drop-shadow-[0_0_8px_rgba(59,130,246,0.8)]">🎮</span>
                  <h1 className="text-sm lg:text-xl mt-1 text-transparent bg-clip-text bg-gradient-to-r from-blue-400 via-indigo-400 to-purple-500 hidden lg:block" style={{ fontFamily: "'Press Start 2P', cursive" }}>
                    JDOT
                  </h1>
                </div>

                <nav className="flex flex-col gap-2 px-2 lg:px-4 mt-2 overflow-y-auto scrollbar-hide flex-1">
                  <button onClick={() => { setActiveTab('featured'); setFocusedIndex(0); }} className={`flex items-center justify-center lg:justify-start gap-3 p-3 lg:px-4 lg:py-3 rounded-xl transition-all font-bold ${activeTab === 'featured' ? 'bg-blue-600 text-white shadow-[0_0_15px_rgba(37,99,235,0.4)]' : 'text-gray-400 hover:bg-gray-800 hover:text-white'}`}>
                    <svg className="w-6 h-6 lg:w-5 lg:h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z"></path></svg>
                    <span className="hidden lg:inline">Featured</span>
                  </button>
                  <button onClick={() => { setActiveTab('all'); setFocusedIndex(0); }} className={`flex items-center justify-center lg:justify-start gap-3 p-3 lg:px-4 lg:py-3 rounded-xl transition-all font-bold ${activeTab === 'all' ? 'bg-blue-600 text-white shadow-[0_0_15px_rgba(37,99,235,0.4)]' : 'text-gray-400 hover:bg-gray-800 hover:text-white'}`}>
                    <svg className="w-6 h-6 lg:w-5 lg:h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
                    <span className="hidden lg:inline">All Games</span>
                  </button>
                  {user && (
                    <button onClick={() => { setActiveTab('shelf'); setFocusedIndex(0); }} className={`flex items-center justify-center lg:justify-start gap-3 p-3 lg:px-4 lg:py-3 rounded-xl transition-all font-bold ${activeTab === 'shelf' ? 'bg-blue-600 text-white shadow-[0_0_15px_rgba(37,99,235,0.4)]' : 'text-gray-400 hover:bg-gray-800 hover:text-white'}`}>
                      <svg className="w-6 h-6 lg:w-5 lg:h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"></path></svg>
                      <span className="hidden lg:inline">My Shelf</span>
                    </button>
                  )}
                </nav>
              </div>

              <div className="p-2 lg:p-4 border-t border-gray-800 flex-shrink-0">
                {user ? (
                  <div className="bg-gray-800 rounded-xl p-2 lg:p-3 flex flex-col items-center lg:items-stretch gap-3">
                    <div className="flex items-center gap-3">
                      <img src={user.photoURL} alt="Profile" className="w-10 h-10 rounded-full border-2 border-indigo-500" />
                      <p className="text-sm font-bold truncate hidden lg:block">{user.displayName}</p>
                    </div>
                    <button onClick={logout} className="w-full py-2 bg-gray-700 hover:bg-red-600 text-xs lg:text-sm rounded-lg transition-colors font-bold shadow-md text-white">
                      <span className="hidden lg:inline">Sign Out</span>
                      <svg className="w-5 h-5 lg:hidden mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                    </button>
                  </div>
                ) : (
                  <button onClick={login} className="w-full p-2 lg:py-3 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 rounded-xl flex items-center justify-center gap-2 transition-all shadow-[0_0_15px_rgba(37,99,235,0.3)] text-white">
                    <svg className="w-5 h-5 lg:w-4 lg:h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M12.48 10.92v3.28h7.84c-.24 1.84-.853 3.187-1.787 4.133-1.147 1.147-2.933 2.4-6.053 2.4-4.827 0-8.6-3.893-8.6-8.72s3.773-8.72 8.6-8.72c2.6 0 4.507 1.027 5.907 2.347l2.307-2.307C18.747 1.44 16.133 0 12.48 0 5.867 0 .307 5.387.307 12s5.56 12 12.173 12c3.573 0 6.267-1.173 8.373-3.36 2.16-2.16 2.84-5.213 2.84-7.667 0-.76-.053-1.467-.173-2.053H12.48z"/></svg>
                    <span className="hidden lg:inline text-sm font-bold">Sign In</span>
                  </button>
                )}
              </div>
            </aside>

            {/* Game Content Area */}
            <main className="flex-1 flex portrait:flex-col landscape:flex-row flex-row overflow-hidden">
              
              {/* Nintendo Switch Style Focus Hero */}
              <div className="relative flex-shrink-0 portrait:h-[35%] landscape:w-[45%] md:w-[35%] xl:w-1/4 bg-gray-900/40 border-b portrait:border-gray-800 landscape:border-r landscape:border-b-0 md:border-r md:border-b-0 border-gray-800 p-4 lg:p-8 flex flex-col justify-center overflow-hidden">
                {focusedGame && (
                  <div className="absolute inset-0 opacity-20 blur-3xl transition-all duration-500" style={{ backgroundImage: `url(${focusedGame.cover})`, backgroundSize: 'cover', backgroundPosition: 'center' }}></div>
                )}
                
                <div className="relative z-10 flex portrait:flex-row landscape:flex-col md:flex-col items-center landscape:items-start md:items-start gap-4 lg:gap-6 h-full">
                  {focusedGame ? (
                    <>
                      <img src={focusedGame.cover} className="w-28 h-28 lg:w-full lg:aspect-square lg:h-auto object-cover rounded-xl lg:rounded-2xl shadow-[0_0_20px_rgba(0,0,0,0.5)] border-2 border-gray-700 flex-shrink-0" />
                      <div className="flex flex-col flex-1 justify-center min-w-0">
                        <h2 className="text-xl lg:text-3xl font-black mb-1 truncate w-full">{focusedGame.title}</h2>
                        <p className="text-[10px] lg:text-sm text-blue-400 font-bold uppercase tracking-widest mb-3 lg:mb-5">{focusedGame.category}</p>
                        <div className="flex gap-2 lg:gap-3">
                          <button onClick={() => window.location.href = focusedGame.url} className="px-5 py-2 lg:px-8 lg:py-3 bg-white text-black text-sm lg:text-base font-bold rounded-full hover:scale-105 transition-transform shadow-[0_0_15px_rgba(255,255,255,0.4)]">
                            Play
                          </button>
                          {user && (
                            <button onClick={() => toggleShelf(focusedGame)} className={`p-2 lg:p-3 rounded-full transition-colors flex items-center justify-center ${shelf.some(g=>g.id===focusedGame.id)?'bg-blue-500 text-white shadow-[0_0_10px_rgba(59,130,246,0.5)]':'bg-gray-800 text-gray-300'}`}>
                              <svg className="w-5 h-5 lg:w-6 lg:h-6" fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/></svg>
                            </button>
                          )}
                        </div>
                      </div>
                    </>
                  ) : (
                    <div className="text-gray-500 flex items-center justify-center h-full w-full font-bold">No games available</div>
                  )}
                </div>
              </div>

              {/* 8-Across Dense Grid */}
              <div className="flex-1 overflow-y-auto p-2 lg:p-6 bg-[#0f1115] scrollbar-hide">
                <div className="grid grid-cols-8 md:grid-cols-10 xl:grid-cols-12 gap-1 sm:gap-2 md:gap-3 lg:gap-4 pb-12 lg:pb-8">
                  {displayGames.map((game, index) => (
                    <div 
                      id={`game-card-${index}`}
                      key={game.id} 
                      onClick={() => handleGameClick(index, game.url)}
                      className={`relative aspect-square rounded bg-gray-800 overflow-hidden cursor-pointer transition-all duration-200 ${focusedIndex === index ? 'ring-2 md:ring-4 ring-white scale-110 z-10 shadow-[0_0_15px_rgba(255,255,255,0.4)]' : 'opacity-70 hover:opacity-100'}`}
                    >
                      <img src={game.cover} alt={game.title} className="w-full h-full object-cover" loading="lazy" />
                    </div>
                  ))}
                </div>
                
                {displayGames.length === 0 && !loading && (
                  <div className="w-full h-full flex flex-col items-center justify-center text-gray-500 text-lg lg:text-2xl font-bold pb-20">
                    <svg className="w-12 h-12 lg:w-20 lg:h-20 mb-4 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.5" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    No games found
                  </div>
                )}
              </div>
            </main>
          </div>

          {/* Portrait Mobile Bottom Nav */}
          <nav className="landscape:hidden md:hidden flex justify-around items-center p-2 pb-6 bg-gray-900 border-t border-gray-800 flex-shrink-0 shadow-[0_-5px_15px_rgba(0,0,0,0.3)] z-20">
            <button onClick={() => { setActiveTab('featured'); setFocusedIndex(0); }} className={`flex flex-col items-center gap-1 p-2 w-20 ${activeTab === 'featured' ? 'text-blue-500' : 'text-gray-500'}`}>
              <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z"></path></svg>
              <span className="text-[10px] font-bold">Featured</span>
            </button>
            <button onClick={() => { setActiveTab('all'); setFocusedIndex(0); }} className={`flex flex-col items-center gap-1 p-2 w-20 ${activeTab === 'all' ? 'text-blue-500' : 'text-gray-500'}`}>
              <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
              <span className="text-[10px] font-bold">All Games</span>
            </button>
            {user && (
              <button onClick={() => { setActiveTab('shelf'); setFocusedIndex(0); }} className={`flex flex-col items-center gap-1 p-2 w-20 ${activeTab === 'shelf' ? 'text-blue-500' : 'text-gray-500'}`}>
                <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"></path></svg>
                <span className="text-[10px] font-bold">My Shelf</span>
              </button>
            )}
          </nav>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
