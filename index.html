<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JDot Games</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <style>
    body { background-color: #0f1115; }
    .scrollbar-hide::-webkit-scrollbar { display: none; }
    .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="text-white font-sans overflow-hidden selection:bg-blue-500 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const firebaseConfig = {
      apiKey: "AIzaSyAZGd0RkWuKwHXMu0CeBA-929PKygz3CNY",
      authDomain: "jdotgames-604ae.firebaseapp.com",
      projectId: "jdotgames-604ae",
      storageBucket: "jdotgames-604ae.firebasestorage.app",
      messagingSenderId: "1018069170554",
      appId: "1:1018069170554:web:15dc5ff8e807cf0c8f7ec3",
      measurementId: "G-QCL0B1G6Z2"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const auth = firebase.auth();
    const db = firebase.firestore();

    function App() {
      const [gamesData, setGamesData] = React.useState([]);
      const [user, setUser] = React.useState(null);
      const [activeTab, setActiveTab] = React.useState('featured');
      const [loading, setLoading] = React.useState(true);
      const [focusedIndex, setFocusedIndex] = React.useState(0);
      const [shelf, setShelf] = React.useState([]);

      React.useEffect(() => {
        const unsubscribe = auth.onAuthStateChanged(currentUser => {
          setUser(currentUser);
          if (currentUser) {
            db.collection('users').doc(currentUser.uid).get().then(doc => {
              if (doc.exists && doc.data().shelf) {
                setShelf(doc.data().shelf);
              }
            }).catch(() => {
              setShelf([]);
            });
          } else {
            setShelf([]);
          }
        });
        return () => unsubscribe();
      }, []);

      React.useEffect(() => {
        async function loadB2Games() {
          try {
            const response = await fetch('/api/get-games');
            if (!response.ok) throw new Error('API routing failed');
            
            const data = await response.json();
            const gamesArray = Array.isArray(data.games) ? data.games : (Array.isArray(data) ? data : []);
            setGamesData(gamesArray);
          } catch (error) {
            setGamesData([]);
          } finally {
            setLoading(false);
          }
        }
        loadB2Games();
      }, []);

      const safeGamesData = Array.isArray(gamesData) ? gamesData : [];
      const displayGames = activeTab === 'featured' 
        ? safeGamesData.filter(g => g.featured) 
        : activeTab === 'shelf' ? shelf : safeGamesData;

      React.useEffect(() => {
        const handleKeyDown = (e) => {
          if (!displayGames || displayGames.length === 0) return;
          
          let cols = 1;
          if (window.innerWidth >= 1024) cols = 4;
          else if (window.innerWidth >= 768) cols = 3;
          else if (window.innerWidth >= 640) cols = 2;
          
          if (e.key === 'ArrowRight') {
            e.preventDefault();
            setFocusedIndex(prev => Math.min(prev + 1, displayGames.length - 1));
          } else if (e.key === 'ArrowLeft') {
            e.preventDefault();
            setFocusedIndex(prev => Math.max(prev - 1, 0));
          } else if (e.key === 'ArrowDown') {
            e.preventDefault();
            setFocusedIndex(prev => Math.min(prev + cols, displayGames.length - 1));
          } else if (e.key === 'ArrowUp') {
            e.preventDefault();
            setFocusedIndex(prev => Math.max(prev - cols, 0));
          } else if (e.key === 'Enter') {
            e.preventDefault();
            const game = displayGames[focusedIndex];
            if (game && game.url) window.location.href = game.url;
          }
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [displayGames, focusedIndex]);

      React.useEffect(() => {
        const activeCard = document.getElementById(`game-card-${focusedIndex}`);
        if (activeCard) {
          activeCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
      }, [focusedIndex]);

      const toggleShelf = (game) => {
        if (!user) return;
        const newShelf = shelf.some(g => g.id === game.id) 
          ? shelf.filter(g => g.id !== game.id)
          : [...shelf, game];
        
        setShelf(newShelf);
        db.collection('users').doc(user.uid).set({ shelf: newShelf }, { merge: true });
      };

      const login = () => {
        const provider = new firebase.auth.GoogleAuthProvider();
        auth.signInWithPopup(provider);
      };
      
      const logout = () => auth.signOut();

      if (loading) {
        return (
          <div className="flex items-center justify-center h-screen bg-[#0f1115]">
            <div className="animate-spin rounded-full h-16 w-16 border-t-4 border-blue-500"></div>
          </div>
        );
      }

      return (
        <div className="flex flex-col md:flex-row h-screen bg-[#0f1115]">
          <aside className="w-full md:w-64 md:h-screen bg-gray-900 border-b md:border-b-0 md:border-r border-gray-800 flex flex-col justify-between flex-shrink-0 z-20 shadow-2xl">
            <div>
              <div className="p-6 flex items-center justify-center md:justify-start gap-3">
                <svg className="w-8 h-8 text-blue-500 drop-shadow-[0_0_8px_rgba(59,130,246,0.8)]" fill="currentColor" viewBox="0 0 24 24">
                  <path d="M21.58 8.08l-3.66-3.66A2.98 2.98 0 0 0 15.8 3.5H8.2a2.98 2.98 0 0 0-2.12.92L2.42 8.08A2.96 2.96 0 0 0 1.5 10.2v4.3c0 1.66 1.34 3 3 3h2.15l2.42 2.42c.56.56 1.33.88 2.13.88h1.6c.8 0 1.57-.32 2.13-.88l2.42-2.42H19.5c1.66 0 3-1.34 3-3v-4.3c0-.8-.32-1.56-.92-2.12zM7.5 12a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zm3-3.5a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0zm4 4.5a1 1 0 1 1 0-2 1 1 0 0 1 0 2zm2.5-2.5a1 1 0 1 1 0-2 1 1 0 0 1 0 2zm-1-3a1 1 0 1 1 0-2 1 1 0 0 1 0 2z"/>
                </svg>
                <h1 className="text-3xl font-black italic tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-blue-400 via-indigo-400 to-purple-500 drop-shadow-[0_2px_2px_rgba(0,0,0,0.8)]">
                  JDOT
                </h1>
              </div>

              <nav className="flex flex-row md:flex-col gap-2 px-4 pb-4 md:pb-0 overflow-x-auto md:overflow-visible scrollbar-hide">
                <button 
                  onClick={() => { setActiveTab('featured'); setFocusedIndex(0); }} 
                  className={`flex items-center gap-3 px-4 py-3 rounded-xl transition-all font-bold whitespace-nowrap ${activeTab === 'featured' ? 'bg-blue-600 text-white shadow-[0_0_15px_rgba(37,99,235,0.4)]' : 'text-gray-400 hover:bg-gray-800 hover:text-white'}`}
                >
                  <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z"></path></svg>
                  Featured
                </button>
                <button 
                  onClick={() => { setActiveTab('all'); setFocusedIndex(0); }} 
                  className={`flex items-center gap-3 px-4 py-3 rounded-xl transition-all font-bold whitespace-nowrap ${activeTab === 'all' ? 'bg-blue-600 text-white shadow-[0_0_15px_rgba(37,99,235,0.4)]' : 'text-gray-400 hover:bg-gray-800 hover:text-white'}`}
                >
                  <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
                  All Games
                </button>
                {user && (
                  <button 
                    onClick={() => { setActiveTab('shelf'); setFocusedIndex(0); }} 
                    className={`flex items-center gap-3 px-4 py-3 rounded-xl transition-all font-bold whitespace-nowrap ${activeTab === 'shelf' ? 'bg-blue-600 text-white shadow-[0_0_15px_rgba(37,99,235,0.4)]' : 'text-gray-400 hover:bg-gray-800 hover:text-white'}`}
                  >
                    <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"></path></svg>
                    My Shelf
                  </button>
                )}
              </nav>
            </div>

            <div className="p-4 md:border-t border-gray-800 hidden md:block">
              {user ? (
                <div className="bg-gray-800 rounded-xl p-3 flex flex-col gap-3">
                  <div className="flex items-center gap-3">
                    <img src={user.photoURL} alt="Profile" className="w-10 h-10 rounded-full border-2 border-indigo-500" />
                    <div className="overflow-hidden">
                      <p className="text-sm font-bold truncate">{user.displayName}</p>
                      <p className="text-xs text-gray-400 truncate">Player 1</p>
                    </div>
                  </div>
                  <button onClick={logout} className="w-full py-2 bg-gray-700 hover:bg-red-600 text-sm rounded-lg transition-colors font-bold shadow-md">
                    Sign Out
                  </button>
                </div>
              ) : (
                <button onClick={login} className="w-full py-3 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-sm rounded-xl transition-all font-bold shadow-[0_0_15px_rgba(37,99,235,0.3)] flex items-center justify-center gap-2">
                  <svg className="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M12.48 10.92v3.28h7.84c-.24 1.84-.853 3.187-1.787 4.133-1.147 1.147-2.933 2.4-6.053 2.4-4.827 0-8.6-3.893-8.6-8.72s3.773-8.72 8.6-8.72c2.6 0 4.507 1.027 5.907 2.347l2.307-2.307C18.747 1.44 16.133 0 12.48 0 5.867 0 .307 5.387.307 12s5.56 12 12.173 12c3.573 0 6.267-1.173 8.373-3.36 2.16-2.16 2.84-5.213 2.84-7.667 0-.76-.053-1.467-.173-2.053H12.48z"/></svg>
                  Sign In
                </button>
              )}
            </div>
          </aside>

          <main className="flex-1 p-6 md:p-10 overflow-y-auto scrollbar-hide">
            <header className="flex md:hidden justify-end mb-6">
              {user ? (
                <img onClick={logout} src={user.photoURL} alt="Profile" className="w-10 h-10 rounded-full border-2 border-indigo-500 shadow-lg cursor-pointer" />
              ) : (
                <button onClick={login} className="px-4 py-2 bg-blue-600 text-sm rounded-full font-bold">Sign In</button>
              )}
            </header>

            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8 pb-24">
              {displayGames.map((game, index) => (
                <div 
                  id={`game-card-${index}`}
                  key={game.id} 
                  className={`relative w-full aspect-[3/4] rounded-2xl bg-gray-800 overflow-hidden transition-all duration-300 transform shadow-2xl cursor-pointer ${focusedIndex === index ? 'scale-105 ring-4 ring-white z-10 shadow-[0_0_30px_rgba(255,255,255,0.3)]' : 'scale-100 opacity-70 hover:opacity-100'}`}
                  onMouseEnter={() => setFocusedIndex(index)}
                  onClick={() => window.location.href = game.url}
                >
                  <img src={game.cover} alt={game.title} className="absolute inset-0 w-full h-full object-cover transition-transform duration-700 hover:scale-110" />
                  
                  <div className="absolute inset-0 bg-gradient-to-t from-[#0f1115] via-[#0f1115]/60 to-transparent flex flex-col justify-end p-6">
                    <h3 className="text-xl md:text-2xl font-black mb-1 truncate drop-shadow-md">{game.title}</h3>
                    <p className="text-xs text-blue-400 font-bold uppercase tracking-widest mb-5">{game.category}</p>
                    
                    <div className="flex justify-between items-center">
                      <a 
                        href={game.url} 
                        className={`px-6 py-2.5 rounded-full font-bold text-sm transition-colors ${focusedIndex === index ? 'bg-white text-black' : 'bg-gray-700/80 text-white backdrop-blur-sm'}`}
                        onClick={(e) => e.stopPropagation()}
                      >
                        Play Now
                      </a>
                      {user && (
                        <button 
                          onClick={(e) => { e.stopPropagation(); toggleShelf(game); }} 
                          className={`p-3 rounded-full transition-colors backdrop-blur-sm ${shelf.some(g => g.id === game.id) ? 'bg-blue-500 text-white shadow-[0_0_10px_rgba(59,130,246,0.5)]' : 'bg-gray-800/80 text-gray-300 hover:bg-gray-700'}`}
                        >
                          <svg className="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
                            <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z" />
                          </svg>
                        </button>
                      )}
                    </div>
                  </div>
                </div>
              ))}
            </div>
            
            {displayGames.length === 0 && !loading && (
              <div className="w-full h-full flex flex-col items-center justify-center text-gray-500 text-2xl font-bold pb-20">
                <svg className="w-20 h-20 mb-4 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.5" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                No games found
              </div>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
