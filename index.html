<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JDot Games</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <style>
    body { background-color: #111827; }
    .scrollbar-hide::-webkit-scrollbar { display: none; }
    .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const firebaseConfig = {
      apiKey: "AIzaSyAZGd0RkWuKwHXMu0CeBA-929PKygz3CNY",
      authDomain: "jdotgames-604ae.firebaseapp.com",
      projectId: "jdotgames-604ae",
      storageBucket: "jdotgames-604ae.firebasestorage.app",
      messagingSenderId: "1018069170554",
      appId: "1:1018069170554:web:15dc5ff8e807cf0c8f7ec3",
      measurementId: "G-QCL0B1G6Z2"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const auth = firebase.auth();
    const db = firebase.firestore();

    function App() {
      const [gamesData, setGamesData] = React.useState([]);
      const [user, setUser] = React.useState(null);
      const [activeTab, setActiveTab] = React.useState('featured');
      const [loading, setLoading] = React.useState(true);
      const [focusedIndex, setFocusedIndex] = React.useState(0);
      const [shelf, setShelf] = React.useState([]);

      React.useEffect(() => {
        const unsubscribe = auth.onAuthStateChanged(currentUser => {
          setUser(currentUser);
          if (currentUser) {
            db.collection('users').doc(currentUser.uid).get().then(doc => {
              if (doc.exists && doc.data().shelf) {
                setShelf(doc.data().shelf);
              }
            }).catch(() => {
              setShelf([]);
            });
          } else {
            setShelf([]);
          }
        });
        return () => unsubscribe();
      }, []);

      React.useEffect(() => {
        async function loadB2Games() {
          try {
            const response = await fetch('/api/get-games');
            if (!response.ok) throw new Error('API routing failed');
            
            const data = await response.json();
            const gamesArray = Array.isArray(data.games) ? data.games : (Array.isArray(data) ? data : []);
            setGamesData(gamesArray);
          } catch (error) {
            setGamesData([]);
          } finally {
            setLoading(false);
          }
        }
        loadB2Games();
      }, []);

      const safeGamesData = Array.isArray(gamesData) ? gamesData : [];
      const displayGames = activeTab === 'featured' 
        ? safeGamesData.filter(g => g.featured) 
        : activeTab === 'shelf' ? shelf : safeGamesData;

      React.useEffect(() => {
        const handleKeyDown = (e) => {
          if (!displayGames || displayGames.length === 0) return;
          
          if (e.key === 'ArrowRight') {
            e.preventDefault();
            setFocusedIndex(prev => Math.min(prev + 1, displayGames.length - 1));
          } else if (e.key === 'ArrowLeft') {
            e.preventDefault();
            setFocusedIndex(prev => Math.max(prev - 1, 0));
          } else if (e.key === 'Enter') {
            e.preventDefault();
            const game = displayGames[focusedIndex];
            if (game && game.url) window.location.href = game.url;
          }
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [displayGames, focusedIndex]);

      const toggleShelf = (game) => {
        if (!user) return;
        const newShelf = shelf.some(g => g.id === game.id) 
          ? shelf.filter(g => g.id !== game.id)
          : [...shelf, game];
        
        setShelf(newShelf);
        db.collection('users').doc(user.uid).set({ shelf: newShelf }, { merge: true });
      };

      const login = () => {
        const provider = new firebase.auth.GoogleAuthProvider();
        auth.signInWithPopup(provider);
      };
      
      const logout = () => auth.signOut();

      if (loading) {
        return (
          <div className="flex items-center justify-center h-screen bg-gray-900 text-white">
            <div className="animate-spin rounded-full h-16 w-16 border-t-4 border-blue-500"></div>
          </div>
        );
      }

      return (
        <div className="min-h-screen bg-gray-900 text-white font-sans overflow-hidden select-none flex flex-col">
          <nav className="flex justify-between items-center p-6 bg-gray-800 shadow-xl z-20">
            <h1 className="text-3xl font-black tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-purple-500">
              JDOT GAMES
            </h1>
            <div className="flex gap-4 items-center">
              {user ? (
                <div className="flex items-center gap-4">
                  <img src={user.photoURL} alt="Profile" className="w-10 h-10 rounded-full border-2 border-blue-500 shadow-lg" />
                  <button onClick={logout} className="px-5 py-2 bg-gray-700 hover:bg-red-600 rounded-full transition-colors font-bold shadow">
                    Logout
                  </button>
                </div>
              ) : (
                <button onClick={login} className="px-6 py-2 bg-blue-600 hover:bg-blue-500 rounded-full transition-colors font-bold shadow-lg">
                  Login with Google
                </button>
              )}
            </div>
          </nav>
          
          <div className="flex-1 p-8 flex flex-col">
            <div className="flex gap-8 mb-10 text-xl font-bold">
              <button 
                onClick={() => { setActiveTab('featured'); setFocusedIndex(0); }} 
                className={`pb-2 transition-colors ${activeTab === 'featured' ? 'text-white border-b-4 border-blue-500' : 'text-gray-500 hover:text-gray-300'}`}
              >
                Featured
              </button>
              <button 
                onClick={() => { setActiveTab('all'); setFocusedIndex(0); }} 
                className={`pb-2 transition-colors ${activeTab === 'all' ? 'text-white border-b-4 border-blue-500' : 'text-gray-500 hover:text-gray-300'}`}
              >
                All Games
              </button>
              {user && (
                <button 
                  onClick={() => { setActiveTab('shelf'); setFocusedIndex(0); }} 
                  className={`pb-2 transition-colors ${activeTab === 'shelf' ? 'text-white border-b-4 border-blue-500' : 'text-gray-500 hover:text-gray-300'}`}
                >
                  My Shelf
                </button>
              )}
            </div>

            <div className="flex gap-8 overflow-x-auto pb-12 pt-4 px-4 -mx-4 scrollbar-hide snap-x flex-1 items-center">
              {displayGames.map((game, index) => (
                <div 
                  key={game.id} 
                  className={`flex-none w-80 h-[26rem] rounded-3xl bg-gray-800 relative overflow-hidden transition-all duration-300 transform snap-center shadow-2xl cursor-pointer ${focusedIndex === index ? 'scale-110 ring-4 ring-white z-10' : 'scale-95 opacity-60 hover:opacity-80'}`}
                  onClick={() => setFocusedIndex(index)}
                  onDoubleClick={() => window.location.href = game.url}
                >
                  <img src={game.cover || 'https://images.unsplash.com/photo-1550745165-9bc0b252726f?w=600&q=80'} alt={game.title} className="w-full h-full object-cover" />
                  
                  <div className="absolute inset-0 bg-gradient-to-t from-black via-black/60 to-transparent flex flex-col justify-end p-6">
                    <h3 className="text-2xl font-black mb-1 truncate shadow-sm">{game.title}</h3>
                    <p className="text-sm text-blue-400 font-bold uppercase tracking-wider mb-4">{game.category || 'Arcade'}</p>
                    
                    <div className="flex justify-between items-center">
                      <a 
                        href={game.url} 
                        className={`px-6 py-2 rounded-full font-bold transition-colors ${focusedIndex === index ? 'bg-white text-black' : 'bg-gray-700 text-white'}`}
                      >
                        Play
                      </a>
                      {user && (
                        <button 
                          onClick={(e) => { e.stopPropagation(); toggleShelf(game); }} 
                          className={`p-3 rounded-full transition-colors ${shelf.some(g => g.id === game.id) ? 'bg-blue-500 text-white' : 'bg-gray-700 text-gray-300 hover:bg-gray-600'}`}
                        >
                          <svg className="w-6 h-6" fill="currentColor" viewBox="0 0 20 20">
                            <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z" />
                          </svg>
                        </button>
                      )}
                    </div>
                  </div>
                </div>
              ))}
              {displayGames.length === 0 && (
                <div className="w-full text-center text-gray-500 text-2xl font-bold py-20">
                  No games found.
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
